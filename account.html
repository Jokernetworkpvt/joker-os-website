<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Joker Network | My Account</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #07050c;
    color: #fff;
    min-height: 100vh;
}

a {
    text-decoration: none;
    color: inherit;
}

.navbar {
    position: sticky;
    top: 0;
    z-index: 1000;

    min-height: 74px;
    padding: 16px 7%;

    display: flex;
    align-items: center;
    justify-content: space-between;

    background: rgba(7,5,12,.92);
    border-bottom: 1px solid rgba(255,255,255,.07);

    backdrop-filter: blur(18px);
}

.logo {
    font-size: 23px;
    font-weight: 950;
    letter-spacing: 1px;
}

.logo-network {
    background: linear-gradient(90deg,#a75cff,#ff38b0);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.nav-links {
    display: flex;
    gap: 25px;
}

.nav-links a {
    color: #aaa3b2;
    font-size: 13px;
    font-weight: 700;
}

.nav-links a:hover {
    color: #d276ff;
}

.page {
    max-width: 1250px;
    margin: auto;
    padding: 60px 7% 100px;
}

.eyebrow {
    color: #b566ed;
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 3px;
}

h1 {
    margin-top: 10px;
    font-size: clamp(38px,6vw,62px);
    letter-spacing: -2px;
}

.subtitle {
    margin-top: 14px;
    color: #99919f;
    line-height: 1.7;
}

.account-grid {
    margin-top: 40px;

    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 25px;
}

.card {
    padding: 26px;

    border-radius: 20px;

    background:
        linear-gradient(
            145deg,
            rgba(31,19,45,.95),
            rgba(11,8,17,.98)
        );

    border: 1px solid rgba(190,100,255,.15);
}

.profile-card {
    height: fit-content;
}

.avatar {
    width: 85px;
    height: 85px;

    display: flex;
    align-items: center;
    justify-content: center;

    margin-bottom: 20px;

    border-radius: 50%;

    font-size: 38px;

    background:
        linear-gradient(
            135deg,
            #762cff,
            #d72cff
        );
}

.profile-name {
    font-size: 23px;
    font-weight: 950;
}

.profile-email {
    margin-top: 7px;

    color: #88818d;
    font-size: 12px;
    word-break: break-word;
}

.profile-info {
    margin-top: 25px;
}

.info-row {
    padding: 13px 0;

    display: flex;
    justify-content: space-between;
    gap: 15px;

    border-bottom: 1px solid rgba(255,255,255,.06);

    color: #99919f;
    font-size: 11px;
}

.info-row strong {
    color: #ddd6e1;
    text-align: right;
}

.orders-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;

    margin-bottom: 22px;
}

.orders-header h2 {
    font-size: 21px;
}

.order-count {
    padding: 7px 12px;

    border-radius: 20px;

    color: #c778ff;
    background: rgba(190,100,255,.08);

    border: 1px solid rgba(190,100,255,.15);

    font-size: 11px;
    font-weight: 900;
}

.order-card {
    margin-bottom: 17px;
    padding: 20px;

    border-radius: 15px;

    background: rgba(255,255,255,.025);
    border: 1px solid rgba(255,255,255,.06);
}

.order-top {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    align-items: flex-start;
}

.order-id {
    color: #c26cff;
    font-size: 12px;
    font-weight: 950;
}

.order-date {
    margin-top: 6px;

    color: #77717d;
    font-size: 10px;
}

.status {
    padding: 7px 10px;

    border-radius: 20px;

    color: #8cffb9;
    background: rgba(80,255,150,.07);

    border: 1px solid rgba(80,255,150,.12);

    font-size: 9px;
    font-weight: 900;
}

.product-name {
    margin-top: 20px;

    font-size: 17px;
    font-weight: 950;
}

.configuration {
    margin-top: 12px;

    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 20px;
}

.configuration-item {
    padding: 9px 0;

    border-bottom: 1px solid rgba(255,255,255,.05);

    color: #88818d;
    font-size: 10px;
}

.configuration-item strong {
    display: block;

    margin-top: 4px;

    color: #ddd6e1;
    font-size: 11px;
}

.order-bottom {
    margin-top: 18px;
    padding-top: 17px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    border-top: 1px solid rgba(255,255,255,.07);
}

.order-price {
    font-size: 19px;
    font-weight: 950;

    color: #c26cff;
}

.empty {
    padding: 55px 20px;

    text-align: center;
}

.empty-icon {
    font-size: 55px;
}

.empty h3 {
    margin-top: 18px;
    font-size: 20px;
}

.empty p {
    margin-top: 10px;

    color: #88818d;
    line-height: 1.6;
}

.shop-button {
    display: inline-block;

    margin-top: 22px;
    padding: 13px 20px;

    border-radius: 9px;

    background: linear-gradient(
        90deg,
        #762cff,
        #d72cff
    );

    font-size: 11px;
    font-weight: 900;
}

.danger-button {
    width: 100%;

    margin-top: 22px;
    padding: 13px;

    border-radius: 9px;

    background: rgba(255,60,90,.05);

    border: 1px solid rgba(255,60,90,.16);

    color: #ff8095;

    cursor: pointer;

    font-size: 10px;
    font-weight: 900;
}

.danger-button:hover {
    background: rgba(255,60,90,.1);
}

footer {
    padding: 35px 7%;

    background: #040308;

    border-top: 1px solid rgba(255,255,255,.06);

    text-align: center;

    color: #66606d;
    font-size: 10px;
}

@media(max-width:850px) {

    .account-grid {
        grid-template-columns: 1fr;
    }

}

@media(max-width:600px) {

    .nav-links {
        display: none;
    }

    .page {
        padding: 45px 5% 70px;
    }

    .configuration {
        grid-template-columns: 1fr;
    }

    .order-top {
        flex-direction: column;
    }

}
</style>
</head>

<body>

<header class="navbar">

    <a href="index.html" class="logo">
        JOKER
        <span class="logo-network">NETWORK</span>
    </a>

    <nav class="nav-links">

        <a href="index.html">Home</a>

        <a href="shop.html">Shop</a>

        <a href="joker-os.html">Joker OS</a>

        <a href="games.html">Games</a>

        <a href="cart.html">Cart</a>

    </nav>

</header>


<main class="page">

    <div class="eyebrow">
        JOKER NETWORK
    </div>

    <h1>
        My Account
    </h1>

    <p class="subtitle">
        Manage your profile and view your Joker Network orders.
    </p>


    <section class="account-grid">


        <!-- PROFILE -->

        <aside class="card profile-card">

            <div class="avatar">
                🃏
            </div>

            <div
                id="profileName"
                class="profile-name"
            >
                Joker Customer
            </div>

            <div
                id="profileEmail"
                class="profile-email"
            >
                No email saved
            </div>


            <div class="profile-info">

                <div class="info-row">

                    <span>
                        Orders
                    </span>

                    <strong id="profileOrders">
                        0
                    </strong>

                </div>

                <div class="info-row">

                    <span>
                        Account
                    </span>

                    <strong>
                        Customer
                    </strong>

                </div>

            </div>


            <button
                id="clearOrders"
                class="danger-button"
            >
                Clear Local Order History
            </button>

        </aside>


        <!-- ORDERS -->

        <section class="card">

            <div class="orders-header">

                <h2>
                    📦 My Orders
                </h2>

                <span
                    id="orderCount"
                    class="order-count"
                >
                    0 Orders
                </span>

            </div>


            <div id="ordersContainer">

                <!-- Orders inserted by JavaScript -->

            </div>

        </section>

    </section>

</main>


<footer>

    © 2026 Joker Network. All rights reserved.

</footer>


<script>

/* =========================================
   LOAD ORDERS
========================================= */

function getOrders() {

    try {

        return JSON.parse(
            localStorage.getItem(
                "jokerOrders"
            ) || "[]"
        );

    } catch(error) {

        return [];

    }

}


/* =========================================
   FORMAT PRICE
========================================= */

function formatPrice(price) {

    return "₹" +
        Number(price || 0)
            .toLocaleString("en-IN");

}


/* =========================================
   FORMAT DATE
========================================= */

function formatDate(date) {

    const d =
        new Date(date);

    if (isNaN(d.getTime())) {
        return "Date unavailable";
    }

    return d.toLocaleDateString(
        "en-IN",
        {
            day: "2-digit",
            month: "short",
            year: "numeric"
        }
    );

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================
   DISPLAY ORDERS
========================================= */

function displayOrders() {

    const orders =
        getOrders();

    const container =
        document.getElementById(
            "ordersContainer"
        );

    const count =
        document.getElementById(
            "orderCount"
        );

    const profileOrders =
        document.getElementById(
            "profileOrders"
        );


    count.textContent =
        orders.length +
        (
            orders.length === 1
                ? " Order"
                : " Orders"
        );


    profileOrders.textContent =
        orders.length;


    if (!orders.length) {

        container.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    🛒
                </div>

                <h3>
                    No orders yet
                </h3>

                <p>
                    Your Joker Network orders
                    will appear here after checkout.
                </p>

                <a
                    href="shop.html"
                    class="shop-button"
                >
                    Browse Joker Tech
                </a>

            </div>

        `;

        return;

    }


    /*
       Newest order first
    */

    const newestFirst =
        [...orders].reverse();


    container.innerHTML =
        newestFirst
            .map(
                (order) => {

                    const product =
                        order.product || {};

                    const customer =
                        order.customer || {};


                    return `

                        <article
                            class="order-card"
                        >

                            <div
                                class="order-top"
                            >

                                <div>

                                    <div
                                        class="order-id"
                                    >
                                        ${escapeHTML(
                                            order.orderId ||
                                            "Unknown Order"
                                        )}
                                    </div>

                                    <div
                                        class="order-date"
                                    >
                                        ${formatDate(
                                            order.createdAt
                                        )}
                                    </div>

                                </div>


                                <span
                                    class="status"
                                >
                                    ${escapeHTML(
                                        order.status ||
                                        "Order Received"
                                    )}
                                </span>

                            </div>


                            <div
                                class="product-name"
                            >
                                ${escapeHTML(
                                    product.product ||
                                    "Joker Tech PC"
                                )}
                            </div>


                            <div
                                class="configuration"
                            >

                                <div
                                    class="configuration-item"
                                >

                                    Processor

                                    <strong>
                                        ${escapeHTML(
                                            product.processor ||
                                            "Not specified"
                                        )}
                                    </strong>

                                </div>


                                <div
                                    class="configuration-item"
                                >

                                    RAM

                                    <strong>
                                        ${escapeHTML(
                                            product.ram ||
                                            "Not specified"
                                        )}
                                    </strong>

                                </div>


                                <div
                                    class="configuration-item"
                                >

                                    Storage

                                    <strong>
                                        ${escapeHTML(
                                            product.storage ||
                                            "Not specified"
                                        )}
                                    </strong>

                                </div>


                                <div
                                    class="configuration-item"
                                >

                                    Graphics

                                    <strong>
                                        ${escapeHTML(
                                            product.graphics ||
                                            "Integrated Graphics"
                                        )}
                                    </strong>

                                </div>

                            </div>


                            <div
                                class="order-bottom"
                            >

                                <div>

                                    <div
                                        style="
                                        color:#77717d;
                                        font-size:9px;
                                        margin-bottom:5px;
                                        "
                                    >
                                        ORDER TOTAL
                                    </div>

                                    <div
                                        class="order-price"
                                    >
                                        ${formatPrice(
                                            product.price
                                        )}
                                    </div>

                                </div>


                                <div
                                    style="
                                    text-align:right;
                                    color:#77717d;
                                    font-size:9px;
                                    line-height:1.6;
                                    "
                                >

                                    ${escapeHTML(
                                        customer.name ||
                                        "Customer"
                                    )}

                                    <br>

                                    ${escapeHTML(
                                        customer.state ||
                                        ""
                                    )}

                                </div>

                            </div>

                        </article>

                    `;

                }
            )
            .join("");

}


/* =========================================
   PROFILE INFORMATION
========================================= */

function loadProfile() {

    const orders =
        getOrders();


    if (!orders.length) {
        return;
    }


    /*
       Use latest customer's information
    */

    const latest =
        orders[orders.length - 1];


    const customer =
        latest.customer || {};


    if (customer.name) {

        document
            .getElementById(
                "profileName"
            )
            .textContent =
            customer.name;

    }


    if (customer.email) {

        document
            .getElementById(
                "profileEmail"
            )
            .textContent =
            customer.email;

    } else {

        document
            .getElementById(
                "profileEmail"
            )
            .textContent =
            "No email saved";

    }

}


/* =========================================
   CLEAR ORDERS
========================================= */

document
    .getElementById(
        "clearOrders"
    )
    .addEventListener(
        "click",
        function() {

            const orders =
                getOrders();


            if (!orders.length) {

                alert(
                    "There are no orders to clear."
                );

                return;

            }


            const confirmed =
                confirm(
                    "Are you sure you want to clear your local order history?"
                );


            if (!confirmed) {
                return;
            }


            localStorage.removeItem(
                "jokerOrders"
            );


            localStorage.removeItem(
                "jokerLastOrder"
            );


            displayOrders();


            document
                .getElementById(
                    "profileName"
                )
                .textContent =
                "Joker Customer";


            document
                .getElementById(
                    "profileEmail"
                )
                .textContent =
                "No email saved";

        }
    );


/* =========================================
   START
========================================= */

displayOrders();

loadProfile();

</script>

</body>
</html>
